name: Bug report
description: Report a reproducible product or engineering defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, screenshots, credentials, chat contents, or other private context. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Mac architecture
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the issue without private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Permissions granted
      multiple: true
      options:
        - Accessibility
        - Screen Recording
        - Neither
    validations:
      required: true
